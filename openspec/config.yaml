schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Project: "US AltGr Intl No Dead Keys", a macOS keyboard layout bundle that
  follows xkb us(altgr-intl) with no dead keys. Target: macOS 26+, tested on 27.
  Tooling: bash for end-user scripts; Python 3 (standard library only) for
  development tooling. The bundle ships no custom icon (the text-cursor input
  indicator stays empty for custom icons), so macOS shows its generic one.
  Conventions:
  - Commits follow Conventional Commits (feat, fix, docs, chore, refactor,
    test, ...).
  - Commits are atomic: one logical change per commit.
  - No AI attribution anywhere: no Co-Authored-By trailers or "generated
    with" lines in commits or pull requests.
  - All project text is in English: commit messages, README, code comments,
    OpenSpec artifacts and script output.

